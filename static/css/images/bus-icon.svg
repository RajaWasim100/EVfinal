<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100" height="100">
  <!-- Bus body -->
  <rect x="80" y="120" width="352" height="240" rx="20" ry="20" fill="#09a68c" stroke="#ffffff" stroke-width="8"/>
  
  <!-- Windows -->
  <rect x="100" y="150" width="312" height="60" rx="10" ry="10" fill="#ffffff" opacity="0.8"/>
  
  <!-- Front window -->
  <rect x="100" y="150" width="80" height="60" rx="10" ry="10" fill="#ffffff" opacity="0.8"/>
  
  <!-- Door -->
  <rect x="90" y="240" width="40" height="100" rx="5" ry="5" fill="#ffffff" opacity="0.3"/>
  
  <!-- Headlights -->
  <circle cx="100" cy="330" r="15" fill="#ffffff"/>
  <circle cx="412" cy="330" r="15" fill="#ffffff"/>
  
  <!-- Wheels -->
  <circle cx="140" cy="380" r="30" fill="#333333" stroke="#ffffff" stroke-width="5"/>
  <circle cx="370" cy="380" r="30" fill="#333333" stroke="#ffffff" stroke-width="5"/>
  <circle cx="140" cy="380" r="15" fill="#666666"/>
  <circle cx="370" cy="380" r="15" fill="#666666"/>
  
  <!-- Details -->
  <rect x="220" y="260" width="120" height="10" rx="5" ry="5" fill="#ffffff"/>
  <rect x="220" y="280" width="120" height="10" rx="5" ry="5" fill="#ffffff"/>
  <rect x="220" y="300" width="120" height="10" rx="5" ry="5" fill="#ffffff"/>
  
  <!-- Logo placeholder -->
  <text x="256" y="220" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold">SPOT EV</text>
</svg>
