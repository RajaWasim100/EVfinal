{% extends 'layout.html' %}
{% set hide_header_footer = true %}
{% block title %}Admin Login - Spot EV{% endblock %}

{% block content %}
<head>
    <link rel="stylesheet" href="/static/css/admin-login.css">
</head>
<!-- Login Section -->
<section class="login-section">
    <div class="container">
        <div class="login-container">
            <div class="login-image">
                <div class="login-image-content">
                    <i class="fa-solid fa-user-shield"></i>
                    <h2>Welcome, Admin!</h2>
                    <p>Log in to manage buses, routes, and drivers.</p>
                </div>
            </div>

            <div class="login-form-container">
                <div class="login-header">
                    <h1>Admin Login</h1>
                    <p>Sign in with your Google account</p>
                </div>

                <div id="error-message" class="alert alert-danger" style="display: none;"></div>

                <div class="google-signin-container">
                    <button id="googleSignIn" class="btn btn-google">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                        Sign in with Google
                    </button>
                </div>

                <div class="login-footer">
                    <p>Need help? <a href="{{ url_for('contact') }}">Contact Support</a></p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>


<script>
    // Initialize Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyC_pIQFmNqoCqP1hh2EZynYL58VuLQfJWA",
        authDomain: "ev-app-9d9ad.firebaseapp.com",
        databaseURL: "https://ev-app-9d9ad-default-rtdb.firebaseio.com",
        projectId: "ev-app-9d9ad",
        storageBucket: "ev-app-9d9ad.firebasestorage.app",
        messagingSenderId: "121460657765",
        appId: "1:121460657765:web:6953e8791f944c4f0c408c",
        measurementId: "G-9SZDQL01PQ"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Show error message
    function showError(message) {
        const errorElement = document.getElementById('error-message');
        errorElement.textContent = message;
        errorElement.style.display = 'block';
        console.error(message);
    }

    // Google Sign-in
    document.getElementById('googleSignIn').addEventListener('click', async function() {
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({
                prompt: 'select_account'
            });

            // Try popup first
            const result = await firebase.auth().signInWithPopup(provider);
            console.log('Sign in successful:', result);

            // Get the ID token
            const idToken = await result.user.getIdToken();
            console.log('Got ID token');

            // Send the token to your backend
            const response = await fetch('/admin-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    idToken: idToken
                })
            });

            const data = await response.json();
            console.log('Backend response:', data);

            if (data.status === 'success') {
                window.location.href = '/admin.html';
            } else {
                showError(data.message || 'Authentication failed');
            }
        } catch (error) {
            console.error('Full error:', error);
            if (error.code === 'auth/popup-blocked') {
                // If popup is blocked, try redirect
                try {
                    await firebase.auth().signInWithRedirect(provider);
                } catch (redirectError) {
                    showError('Authentication failed: ' + redirectError.message);
                }
            } else {
                showError('Authentication failed: ' + error.message);
            }
        }
    });

    // Handle redirect result
    firebase.auth().getRedirectResult().then((result) => {
        if (result.user) {
            console.log('Redirect sign in successful:', result);
            return result.user.getIdToken();
        }
    }).then(async (idToken) => {
        if (idToken) {
            console.log('Got ID token from redirect');
            try {
                const response = await fetch('/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        idToken: idToken
                    })
                });

                const data = await response.json();
                console.log('Backend response from redirect:', data);

                if (data.status === 'success') {
                    window.location.href = '/admin.html';
                } else {
                    showError(data.message || 'Authentication failed');
                }
            } catch (error) {
                showError('Failed to verify token: ' + error.message);
            }
        }
    }).catch((error) => {
        console.error('Redirect error:', error);
        showError('Authentication failed: ' + error.message);
    });

    // Check if user is already signed in
    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            console.log('User already signed in:', user);
            user.getIdToken().then((idToken) => {
                fetch('/check_admin_session')
                    .then(response => response.json())
                    .then(data => {
                        console.log('Session check response:', data);
                        if (data.status === 'success') {
                            window.location.href = '/admin.html';
                        }
                    })
                    .catch(error => {
                        console.error('Session check error:', error);
                        showError('Session check failed: ' + error.message);
                    });
            });
        }
    });
</script>


{% endblock %}
