    function normalizeRouteId(routeId) {
        return (routeId || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function startTracking(routeId) {
        // Clear existing tracking
        stopTracking();
        
        // Start tracking drivers for this route
        db.ref("users").on("value", (snapshot) => {
            const users = snapshot.val();
            console.log('Firebase users data:', users);

            // Track which markers should remain
            const activeMarkerIds = new Set();

            if (!users) {
                updateStatusNoDrivers(routeId);
                // Remove all markers if no users
                for (let id in markers) {
                    markers[id].setMap(null);
                    delete markers[id];
                }
                return;
            }

            let busCount = 0;
            const bounds = new google.maps.LatLngBounds();

            // Filter and process only active drivers on the selected route
            Object.entries(users).forEach(([userId, userData]) => {
                // Normalize route IDs for comparison
                const userRouteId = normalizeRouteId(userData.routeId);
                const selectedRouteId = normalizeRouteId(routeId);

                if (userData.isActive && 
                    userRouteId === selectedRouteId && 
                    userData.latitude && userData.longitude) {  // Check for latitude/longitude
                    busCount++;
                    const position = new google.maps.LatLng(
                        parseFloat(userData.latitude),
                        parseFloat(userData.longitude)
                    );
                    activeMarkerIds.add(userId);

                    // Create marker if it doesn't exist
                    if (!markers[userId]) {
                        markers[userId] = new google.maps.Marker({
                            position: position,
                            map: map,
                            title: `Bus ${userData.busId || userId}`,
                            icon: {
                                url: "/static/css/images/bus-solid.png",  // <-- Place your icon in static folder
                                scaledSize: new google.maps.Size(20, 20),  // Adjust size as needed
                                anchor: new google.maps.Point(20, 20) // Center the icon
                            },
                            zIndex: 998
                        });
                        markers[userId].addListener('click', () => {
                            showBusInfo(activeBuses[userId], markers[userId]);
                        });
                    } else {
                        // Just update the marker's position
                        markers[userId].setPosition(position);
                    }

                    // Store bus data for route calculation
                    activeBuses[userId] = {
                        position: position,
                        lat: position.lat(),
                        lng: position.lng(),
                        busId: userData.busId || userId,
                        speed: userData.speed || 0,
                        routeId: userData.routeId,
                        status: userData.status || 'Active',
                        timestamp: userData.timestamp || new Date().toISOString()
                    };

                    bounds.extend(position);
                }
            });

            // Remove markers for buses that are no longer active
            for (let id in markers) {
                if (!activeMarkerIds.has(id)) {
                    markers[id].setMap(null);
                    delete markers[id];
                }
            }

            // Update active buses count and status
            const activeBusCount = document.getElementById('activeBusCount');
            const busStatusMessage = document.getElementById('busStatusMessage');
            if (activeBusCount && busStatusMessage) {
                activeBusCount.textContent = busCount;
                if (busCount > 0) {
                    busStatusMessage.textContent = `${busCount} bus${busCount > 1 ? 'es' : ''} currently active on this route`;
                    busStatusMessage.className = 'text-success';
                } else {
                    busStatusMessage.textContent = 'No active buses found on this route';
                    busStatusMessage.className = 'text-warning';
                }
            }

            // Update last updated time
            const lastUpdated = document.querySelector('#activeBusesSection .status-header p');
            if (lastUpdated) {
                lastUpdated.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            }

            // Fit map to show all buses
            if (Object.keys(markers).length > 0) {
                map.fitBounds(bounds);
            }
        });
    }

    function updateStatusNoDrivers(routeId) {
        const activeBusCount = document.getElementById('activeBusCount');
        const busStatusMessage = document.getElementById('busStatusMessage');
        
        if (activeBusCount && busStatusMessage) {
            activeBusCount.textContent = '0';
            busStatusMessage.textContent = 'No active buses found on this route';
            busStatusMessage.className = 'text-warning';
        }
    }

    function stopTracking() {
        // Clear all markers and their watchers
        for (let id in markers) {
            if (markers[id].watchId) {
                navigator.geolocation.clearWatch(markers[id].watchId);
            }
            markers[id].setMap(null);
            delete markers[id];
        }
        
        // Clear Firebase listeners
        if (db.ref("users").off) {
            db.ref("users").off();
        }
    }

    function findClosestBus() {
        if (!userPosition || !selectedRoute || Object.keys(markers).length === 0) return;

        let closestBus = null;
        let shortestDistance = Infinity;

        // Calculate distances to all buses
        Object.entries(markers).forEach(([id, marker]) => {
            const busPosition = marker.getPosition();
            const distance = google.maps.geometry.spherical.computeDistanceBetween(
                new google.maps.LatLng(userPosition),
                busPosition
            );

            if (distance < shortestDistance) {
                shortestDistance = distance;
                closestBus = { id, position: busPosition };
            }
        });

        if (closestBus) {
            const bus = activeBuses[closestBus.id];
            calculateRoute(userPosition, closestBus.position, bus);
        }
    }

// function calculate route
function calculateRoute(origin, destination, bus, callback) {
    if (!origin || !destination) return;

    const request = {
        origin,
        destination,
        travelMode: google.maps.TravelMode.DRIVING,
        drivingOptions: {
            departureTime: new Date(),
            trafficModel: google.maps.TrafficModel.BEST_GUESS
        }
    };

    directionsService.route(request, (result, status) => {
        if (status === google.maps.DirectionsStatus.OK) {
            directionsRenderer.setDirections(result);

            distanceMatrixService.getDistanceMatrix(
                {
                    origins: [origin],
                    destinations: [destination],
                    travelMode: google.maps.TravelMode.DRIVING,
                    drivingOptions: {
                        departureTime: new Date(),
                        trafficModel: google.maps.TrafficModel.BEST_GUESS
                    }
                },
                (response, status) => {
                    if (status === 'OK') {
                        const route = response.rows[0].elements[0];
                        const distance = route.distance.text;
                        const durationInTraffic = route.duration_in_traffic
                            ? route.duration_in_traffic.text
                            : route.duration.text;
                        const arrivalTime = new Date(
                            Date.now() +
                            (route.duration_in_traffic
                                ? route.duration_in_traffic.value
                                : route.duration.value) * 1000
                        );

                        if (callback) {
                            callback({ distance, durationInTraffic, arrivalTime: arrivalTime.toLocaleTimeString() });
                        }
                    }
                }
            );
        }
    });
}

// abdullah 2nd
function showBusInfo(bus, marker) {
    // Base content with a loading placeholder for distance/ETA
    const baseContent = `
        <div class="bus-info-window">
            <h3>Bus ${bus.busId || 'N/A'}</h3>
            <p><strong>Route:</strong> ${bus.routeId ? bus.routeId.toUpperCase() : 'N/A'}</p>
            <p><strong>Speed:</strong> ${bus.speed ? bus.speed + ' km/h' : 'N/A'}</p>
            <p><strong>Distance:</strong> <span id="distanceField">Calculating...</span></p>
            <p><strong>Estimated Time:</strong> <span id="etaField">Calculating...</span></p>
            <p><strong>Expected Arrival:</strong> <span id="arrivalField">Calculating...</span></p>
            <p><strong>Last Updated:</strong> ${new Date(bus.timestamp).toLocaleTimeString()}</p>
        </div>
    `;

    // Close any previously opened infoWindow
    if (infoWindow) {
        infoWindow.close();
    }

    // Open infoWindow initially with placeholders
    infoWindow = new google.maps.InfoWindow({ content: baseContent });
    infoWindow.open(map, marker);

    // 🚀 Automatically calculate the route and ETA as soon as this is displayed
    if (userPosition) {
        calculateRoute(
            userPosition,
            { lat: bus.lat, lng: bus.lng },
            bus,
            (routeInfo) => {
                // Update infoWindow content with calculated values
                const newContent = `
                    <div class="bus-info-window">
                        <h3>Bus ${bus.busId || 'N/A'}</h3>
                        <p><strong>Route:</strong> ${bus.routeId ? bus.routeId.toUpperCase() : 'N/A'}</p>
                        <p><strong>Speed:</strong> ${bus.speed ? bus.speed + ' km/h' : 'N/A'}</p>
                        <p><strong>Distance:</strong> ${routeInfo.distance}</p>
                        <p><strong>Estimated Time:</strong> ${routeInfo.durationInTraffic}</p>
                        <p><strong>Expected Arrival:</strong> ${routeInfo.arrivalTime}</p>
                        <p><strong>Last Updated:</strong> ${new Date(bus.timestamp).toLocaleTimeString()}</p>
                    </div>
                `;
                infoWindow.setContent(newContent); // Refresh infoWindow
            }
        );
    }
}
